name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "目标环境"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 安装依赖（非 frozen：本地 pnpm-lock.yaml 尚未包含 mysql2，待用户本地 pnpm install 重新生成）
      - name: Install dependencies
        run: pnpm install

      - name: Deploy to CloudBase
        env:
          CLOUDBASE_SECRET_ID: ${{ secrets.CLOUDBASE_SECRET_ID }}
          CLOUDBASE_SECRET_KEY: ${{ secrets.CLOUDBASE_SECRET_KEY }}
          CLOUDBASE_ENV_ID: ${{ secrets.CLOUDBASE_ENV_ID }}
        run: |
          # 仅 production 需要人工确认（GitHub environment protection rule）
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "Deploying to PRODUCTION. Confirm in GitHub environment protection."
          fi
          npm install -g @cloudbase/cli
          tcb framework deploy \
            --mode=${{ github.event.inputs.environment || 'preview' }} \
            --env-id=$CLOUDBASE_ENV_ID

      - name: Smoke test
        if: github.event.inputs.environment == 'production'
        continue-on-error: true
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
        run: |
          # 生产域名请在 GitHub Secrets 设置 SITE_DOMAIN（如 wx-ai-tips-xxx.ap-shanghai.cloudbaseapp.com）
          DOMAIN="${SITE_DOMAIN:-wx-ai-tips.example.com}"
          curl -fsS "https://${DOMAIN}/api/articles?pageSize=1" | jq .
