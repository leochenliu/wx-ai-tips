openapi: 3.0.3
info:
  title: 微信 AI 使用技巧整理站 API
  description: |
    公网 Web 站点 + 作者后台 HTTP API。
    读者接口公开；后台接口需 IP 白名单。
    MCP 接口见 `docs/MCP-CONTRACT.md`（独立文件，使用 JSON-RPC 协议）。
  version: 1.0.0
  contact:
    name: 作者
servers:
  - url: https://wx-ai-tips.example.com
    description: 生产
  - url: http://localhost:3000
    description: 本地开发
tags:
  - name: articles
    description: 文章
  - name: tags
    description: 标签
  - name: search
    description: 搜索
  - name: admin
    description: 作者后台（IP 白名单）
  - name: cheat
    description: Cheat Sheet（v1.0 暂未实现）

paths:
  /api/articles:
    get:
      tags: [articles]
      summary: 文章列表
      operationId: listArticles
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - in: query
          name: tag
          schema: { type: string }
          description: 按 tag slug 过滤
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticles'
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/articles/{slug}:
    get:
      tags: [articles]
      summary: 文章详情
      operationId: getArticleBySlug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]{2,80}$' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: 文章已归档（30 天回收期内）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/tags:
    get:
      tags: [tags]
      summary: 标签列表
      operationId: listTags
      parameters:
        - in: query
          name: prefix
          schema: { type: string }
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Tag' }
                  nextCursor: { type: string, nullable: true }

  /api/tags/{slug}:
    get:
      tags: [tags]
      summary: 单个 tag 详情
      operationId: getTagBySlug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/search:
    get:
      tags: [search]
      summary: 全文搜索
      operationId: search
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ArticleSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/admin/import:
    post:
      tags: [admin]
      summary: 触发导入（IP 白名单）
      operationId: triggerImport
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [full, incremental]
                  default: incremental
      responses:
        '202':
          description: 已接受，导入启动中
          content:
            application/json:
              schema:
                type: object
                properties:
                  importEventId: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 已有导入在运行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/imports:
    get:
      tags: [admin]
      summary: 导入历史
      operationId: listImports
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ImportEvent' }

  /api/admin/tags:
    post:
      tags: [admin]
      summary: 创建 tag
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string, pattern: '^[a-z0-9-]{2,80}$' }
                name: { type: string, minLength: 1, maxLength: 50 }
                description: { type: string, maxLength: 500 }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '409':
          description: slug 冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/tags/{slug}:
    put:
      tags: [admin]
      summary: 重命名 tag（保留旧 slug 为 alias）
      operationId: renameTag
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string }
                name: { type: string }
                description: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '409': { description: 新 slug 已被占用 }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      summary: 删除 tag（必须先合并或显式 force）
      operationId: deleteTag
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: force
          schema: { type: boolean, default: false }
      responses:
        '204': { description: 成功 }
        '409':
          description: 仍有文章关联，未传 force
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/tags/merge:
    post:
      tags: [admin]
      summary: 合并多个 tag 到目标 tag
      operationId: mergeTags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromSlugs, toSlug]
              properties:
                fromSlugs:
                  type: array
                  items: { type: string }
                  minItems: 1
                toSlug: { type: string }
      responses:
        '200':
          description: 合并成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  affected: { type: integer }
                  toTag: { $ref: '#/components/schemas/Tag' }
        '422':
          description: toSlug 在 fromSlugs 中
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    PageParam:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeParam:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: 请求参数无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 未授权（IP 不在白名单）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 触发速率限制
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ArticleSummary:
      type: object
      required: [id, slug, title, summary, publishedAt, tags]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string, maxLength: 300 }
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        coverScreenshotId: { type: string, format: uuid, nullable: true }

    ArticleDetail:
      allOf:
        - $ref: '#/components/schemas/ArticleSummary'
        - type: object
          properties:
            contentMarkdown: { type: string }
            sourceUrl: { type: string, format: uri }
            screenshots:
              type: array
              items: { $ref: '#/components/schemas/Screenshot' }

    PaginatedArticles:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ArticleSummary' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    Tag:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        aliases:
          type: array
          items: { type: string }
        description: { type: string }
        articleCount: { type: integer }

    Screenshot:
      type: object
      required: [id, storageKey, mimeType]
      properties:
        id: { type: string, format: uuid }
        storageKey: { type: string }
        url: { type: string, format: uri }
        mimeType: { type: string }
        width: { type: integer }
        height: { type: integer }
        altText: { type: string }
        sortOrder: { type: integer }
        containsPii: { type: boolean, default: false }

    ImportEvent:
      type: object
      required: [id, source, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [feishu] }
        status: { type: string, enum: [running, succeeded, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        counts:
          type: object
          properties:
            added: { type: integer }
            updated: { type: integer }
            skipped: { type: integer }
            failed: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              articleSlug: { type: string }
              message: { type: string }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        traceId: { type: string }

security:
  - BearerAuth: []

securitySchemes:
  BearerAuth:
    type: http
    scheme: bearer
    description: |
      仅后台 / MCP 接口需要。前台公开接口无需认证。