version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: wx-ai-tips-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local_dev_root
      MYSQL_DATABASE: wx_ai_tips
      MYSQL_USER: app_user
      MYSQL_PASSWORD: local_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动（数据目录为空）时，MySQL 容器会自动执行该初始化脚本建表
      - ./db/migrations/0001_init.mysql.sql:/docker-entrypoint-initdb.d/0001_init.mysql.sql:ro

  minio:
    image: quay.io/minio/minio:latest
    container_name: wx-ai-tips-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data:
